<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;background:linear-gradient(135deg,#f6f7fb,#e9edf5);color:#1d2230;position:relative}
.top{position:absolute;left:120px;top:110px}
.kicker{font-size:28px;font-weight:600;color:#2f8a63;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:96px;font-weight:700;letter-spacing:-2px;margin-top:14px}
.sub{font-size:34px;color:#5a6274;margin-top:18px}
.cards{position:absolute;left:120px;top:470px;display:flex;gap:40px}
.card{width:420px;height:300px;background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(30,40,70,.10);padding:40px;animation:rise 9s ease-in-out infinite}
.card:nth-child(2){animation-delay:.4s}.card:nth-child(3){animation-delay:.8s}
.card .n{font-size:72px;font-weight:700}
.card .l{font-size:28px;color:#5a6274;margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:16px;height:90px;margin-top:30px}
.bars i{display:block;width:44px;border-radius:10px;background:#2f8a63;transform-origin:bottom;animation:grow 4.5s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.25s}.bars i:nth-child(3){animation-delay:.5s}.bars i:nth-child(4){animation-delay:.75s}
.ring{position:absolute;right:120px;bottom:110px;width:340px;height:340px;border-radius:50%;background:linear-gradient(160deg,#ffb36b,#e8608a);box-shadow:0 20px 60px rgba(0,0,0,.25);border:10px solid #fff;overflow:hidden}
.head{position:absolute;left:50%;top:70px;width:130px;height:130px;margin-left:-65px;border-radius:50%;background:#fde3c8;animation:talk 1.6s ease-in-out infinite alternate}
.body{position:absolute;left:50%;bottom:-70px;width:260px;height:200px;margin-left:-130px;border-radius:130px 130px 0 0;background:#2b3a67;animation:talk 1.6s ease-in-out infinite alternate}
.ptr{position:absolute;left:0;top:0;width:44px;height:44px;animation:tour 12s ease-in-out infinite}
.ptr svg{width:44px;height:44px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
#tx{position:absolute;left:0;right:0;top:calc(78% - 70px);text-align:center;pointer-events:none}
#tx span{display:inline-block;font-family:Inter,-apple-system,"Helvetica Neue",sans-serif;font-size:84px;font-weight:800;line-height:1.15;padding:0;animation:pop .35s ease-out}
#tx .classic{color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 4px 8px rgba(0,0,0,.45)}
#tx .neon{color:#fff;text-shadow:0 0 8px #ff2d95,0 0 22px #ff2d95,0 0 48px #ff2d95,0 0 80px #b620e0}
#tx .box{color:#fff;background:#121214;border-radius:18px;padding:14px 34px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.hl{position:absolute;left:100px;top:450px;width:460px;height:340px;border-radius:36px;border:6px solid #f5a524;opacity:0;animation:hl 12s ease-in-out infinite}
@keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes talk{from{transform:translateY(0)}to{transform:translateY(6px)}}
@keyframes tour{0%{transform:translate(1500px,260px)}22%{transform:translate(330px,640px)}40%{transform:translate(330px,640px)}62%{transform:translate(790px,640px)}80%{transform:translate(1250px,640px)}100%{transform:translate(1500px,260px)}}
@keyframes hl{0%,18%{opacity:0}24%,40%{opacity:1}46%,100%{opacity:0}}
</style></head><body>
<div class="top"><div class="kicker">Product walkthrough</div><h1>Q4 Roadmap</h1><div class="sub">What ships next, and why it matters</div></div>
<div class="hl"></div>
<div class="cards">
 <div class="card"><div class="n">3</div><div class="l">New export formats</div><div class="bars"><i style="height:40%"></i><i style="height:60%"></i><i style="height:85%"></i><i style="height:100%"></i></div></div>
 <div class="card"><div class="n">2×</div><div class="l">Faster editing</div><div class="bars"><i style="height:55%"></i><i style="height:45%"></i><i style="height:75%"></i><i style="height:95%"></i></div></div>
 <div class="card"><div class="n">0</div><div class="l">Accounts needed</div><div class="bars"><i style="height:30%;background:#c9cfdb"></i><i style="height:30%;background:#c9cfdb"></i><i style="height:30%;background:#c9cfdb"></i><i style="height:30%;background:#c9cfdb"></i></div></div>
</div>
<div class="ring"><div class="head"></div><div class="body"></div></div>
<div id="tx"></div>
<div class="ptr"><svg viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.4-6.9L4 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
addEventListener('message', (e) => {
  if (e.data && typeof e.data.text === 'string') {
    const t = document.getElementById('tx');
    t.innerHTML = '';
    if (e.data.text) { const sp = document.createElement('span'); sp.className = e.data.style; sp.textContent = e.data.text; t.appendChild(sp); }
    return;
  }
  if (!e.data || typeof e.data.playing !== 'boolean') return;
  for (const a of document.getAnimations()) e.data.playing ? a.play() : a.pause();
});
if (new URLSearchParams(location.search).get('paused') === '1') {
  addEventListener('load', () => { for (const a of document.getAnimations()) { a.currentTime = 2600; a.pause(); } });
}
</script>
</body></html>
