<!doctype html><html><head><meta charset="utf-8"><title>scene</title><style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;background:
 radial-gradient(1200px 700px at 15% 10%,#3a8f73 0%,transparent 60%),
 radial-gradient(1000px 700px at 90% 90%,#5b4bb7 0%,transparent 60%),
 linear-gradient(135deg,#123c33,#1f2350);position:relative}
.cap{position:absolute;left:0;right:0;top:40px;text-align:center;color:#fff;transition:opacity .35s}
.cap h1{font-size:44px;font-weight:700;letter-spacing:-.8px}
.cap p{font-size:20px;opacity:.82;margin-top:10px}
.win{position:absolute;border-radius:12px;overflow:hidden;background:#1e1e1e;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.10);transition:opacity .4s,transform .4s}
.win.gone{opacity:0;transform:scale(.97)}
.bar{height:28px;background:#2a2a2c;display:flex;align-items:center;padding-left:12px;gap:8px;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;display:block}
.bar span{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:#bbb;font-weight:600;pointer-events:none}
iframe{display:block;border:0;background:#1e1e1e}
.stage{position:relative;overflow:hidden}
.stage iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:transparent}
#cur{position:absolute;left:1500px;top:820px;width:26px;height:26px;z-index:10;pointer-events:none;transition:left .6s cubic-bezier(.45,0,.2,1),top .6s cubic-bezier(.45,0,.2,1)}
#cur svg{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transition:transform .12s}
#cur.down svg{transform:scale(.82)}
#cur::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);opacity:0}
#cur.down::after{animation:ripple .45s ease-out}
@keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(1.6);opacity:0}}
</style></head><body>
<div class="cap" id="cap"><h1 id="h"></h1><p id="p"></p></div>
<div id="cur"><svg viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.4-6.9L4 20z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
const v = new URLSearchParams(location.search).get('v') || '1';
const Q = '?camera=granted&mic=granted';
const DIR = location.pathname.replace(/[^/]*$/, '');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const cur = document.getElementById('cur');

function win(title, x, y, w, h, id) {
  const d = document.createElement('div');
  d.className = 'win';
  Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px' });
  if (title !== null) d.innerHTML = '<div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>' + title + '</span></div>';
  document.body.appendChild(d);
  return d;
}
function frame(d, src, w, h, id) {
  const f = document.createElement('iframe');
  f.src = src; f.width = w; f.height = h; f.id = id;
  d.appendChild(f);
  return new Promise((r) => f.addEventListener('load', () => r(f), { once: true }));
}
function stage(d, w, h, id, paused) {
  const s = document.createElement('div');
  s.className = 'stage'; s.style.width = w + 'px'; s.style.height = h + 'px';
  const f = document.createElement('iframe');
  f.src = DIR + 'demo-live.html' + (paused ? '?paused=1' : ''); f.id = id;
  f.style.transform = 'scale(' + w / 1920 + ')';
  s.appendChild(f); d.appendChild(s);
  return new Promise((r) => f.addEventListener('load', () => r(f), { once: true }));
}
function caption(h, p) {
  document.getElementById('h').textContent = h;
  document.getElementById('p').textContent = p;
}
async function recaption(h, p) {
  const c = document.getElementById('cap');
  c.style.opacity = 0; await sleep(350); caption(h, p); c.style.opacity = 1;
}
function doc(id) { return document.getElementById(id).contentDocument; }
function label(b) { return (b.getAttribute('aria-label') || b.title || '').trim(); }
function btn(id, text) {
  const all = [...doc(id).querySelectorAll('button')].filter((b) => b.offsetParent);
  const t = (b) => b.textContent.replace(/\s+/g, ' ').trim();
  return all.find((b) => t(b) === text) || all.find((b) => label(b).startsWith(text)) || all.find((b) => t(b).startsWith(text)) || all.find((b) => t(b).endsWith(' ' + text));
}
async function until(fn, ms = 8000) {
  for (let t = 0; t < ms; t += 100) { const x = fn(); if (x) return x; await sleep(100); }
  throw new Error('timed out');
}
function at(id, el) {
  const fr = document.getElementById(id).getBoundingClientRect(), r = el.getBoundingClientRect();
  return [fr.left + r.left + r.width / 2, fr.top + r.top + r.height / 2];
}
async function point(id, el) {
  const [x, y] = at(id, el);
  cur.style.left = x - 4 + 'px'; cur.style.top = y - 3 + 'px';
  await sleep(650);
}
async function click(id, what, after = 0) {
  const el = typeof what === 'string' ? await until(() => btn(id, what)) : what;
  await point(id, el);
  cur.classList.add('down'); await sleep(110);
  el.click();
  await sleep(140); cur.classList.remove('down');
  await sleep(after);
}
async function type(id, el, text) {
  const proto = Object.getPrototypeOf(el);
  const set = Object.getOwnPropertyDescriptor(proto, 'value').set;
  el.focus();
  set.call(el, ''); el.dispatchEvent(new Event('input', { bubbles: true }));
  for (const ch of text) {
    set.call(el, el.value + ch); el.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(70);
  }
}
async function choose(id, el, value) {
  await point(id, el);
  el.value = value; el.dispatchEvent(new Event('change', { bubbles: true })); el.dispatchEvent(new Event('input', { bubbles: true }));
}
function demoInEditor(id, paused) {
  const d = doc(id);
  const c = d.querySelector('.preview canvas.live');
  const f = d.createElement('iframe');
  f.src = DIR + 'demo-live.html' + (paused ? '?paused=1' : '');
  f.id = 'demo';
  const sync = () => {
    const w = parseFloat(c.style.width) || c.getBoundingClientRect().width;
    f.style.cssText = `position:absolute;left:${c.style.left};top:${c.style.top};width:1920px;height:1080px;border:0;transform:scale(${w / 1920});transform-origin:0 0;pointer-events:none;background:transparent`;
  };
  sync();
  setInterval(sync, 100);
  c.after(f);
  return new Promise((r) => f.addEventListener('load', () => r(f), { once: true }));
}
function demoText(id, text, style) {
  const f = doc(id).getElementById('demo');
  f.contentWindow.postMessage({ text, style }, '*');
}
function playDemo(id, on) {
  const f = doc(id).getElementById('demo');
  if (f) f.contentWindow.postMessage({ playing: on }, '*');
}

let go;
window.__go = () => go();
const started = new Promise((r) => (go = r));

async function editorWindow(title) {
  const d = win(title, 130, 152, 1340, 0);
  const f = await frame(d, '/' + Q + '#/editor', 1340, 712, 'e');
  await until(() => doc('e').querySelector('.preview canvas.live'));
  await sleep(600);
  return d;
}

const scenes = {
  async '1'() {
    caption('Record your screen, camera and voice', 'Pick a display, a window, an app or a region, and press Record.');
    const desk = win('Q4 Roadmap', 110, 210, 840, 0);
    await stage(desk, 840, 473, 'desk', false);
    const p = win('simple-capture', 1090, 160, 390, 0);
    await frame(p, '/' + Q + '#/panel', 390, 690, 'f');
    await until(() => btn('f', 'Record'));
    const ed = await editorWindow('Q4 roadmap walkthrough');
    ed.classList.add('gone');
    await demoInEditor('e', true);
    await sleep(500);
    document.title = 'READY'; await started;
    await sleep(700);
    await click('f', 'Windows', 650);
    await click('f', 'Apps', 650);
    await click('f', 'Displays', 450);
    await click('f', '16:9', 750);
    await click('f', '9:16', 750);
    await click('f', '1:1', 750);
    await click('f', 'Original', 600);
    await click('f', 'Record', 300);
    p.classList.add('gone');
    const b = win(null, 260, 715, 520, 0); b.classList.add('gone');
    await frame(b, '/' + Q + '&state=recording&elapsed=0#/bar', 520, 56, 'b');
    b.classList.remove('gone');
    cur.style.left = '1250px'; cur.style.top = '560px';
    await sleep(5200);
    await click('b', 'Stop', 500);
    b.classList.add('gone');
    desk.classList.add('gone');
    await recaption('Then trim, add text and export', 'The editor opens with screen, camera and audio on their own tracks.');
    ed.classList.remove('gone');
    await sleep(3000);
  },
  async '2'() {
    caption('Edit on a timeline', 'Screen, camera and text on their own tracks. Add text and style it in a click.');
    await editorWindow('Q4 roadmap walkthrough');
    await demoInEditor('e', true);
    document.title = 'READY'; await started;
    await sleep(600);
    await click('e', 'Play'); playDemo('e', true);
    await sleep(3000);
    await click('e', 'Pause'); playDemo('e', false);
    await click('e', 'Add text at the playhead', 600);
    const ta = await until(() => doc('e').querySelector('textarea'));
    await point('e', ta);
    demoText('e', '', 'classic');
    await type('e', ta, 'Ships in December');
    demoText('e', 'Ships in December', 'classic');
    await sleep(600);
    await click('e', 'Neon'); demoText('e', 'Ships in December', 'neon');
    await sleep(900);
    await click('e', 'Box'); demoText('e', 'Ships in December', 'box');
    await sleep(900);
    await click('e', 'Play'); playDemo('e', true);
    await sleep(4200);
  },
  async '3'() {
    caption('Export MP4, MOV, WebM, GIF or WebP', 'Presets for email, chat and social video, with a size estimate before you start.');
    await editorWindow('Q4 roadmap walkthrough');
    await demoInEditor('e', true);
    document.title = 'READY'; await started;
    await sleep(600);
    await click('e', 'Export (', 900);
    await click('e', 'Slack & Teams', 1000);
    await click('e', 'TikTok, Reels & Shorts', 1000);
    await click('e', 'GIF', 1100);
    await click('e', 'YouTube', 1000);
    await click('e', 'MOV', 900);
    await click('e', 'MP4', 900);
    const all = [...doc('e').querySelectorAll('button')].filter((b) => b.textContent.trim() === 'Export');
    await click('e', all[all.length - 1], 300);
    await until(() => /Exported/.test(doc('e').body.innerText), 10000);
    await sleep(600);
    const show = await until(() => btn('e', 'Show in Finder'));
    await point('e', show);
    await sleep(2400);
  },
};

scenes[v]().then(() => { document.title = 'DONE'; }, (e) => { document.title = 'FAILED ' + e.message; });
</script></body></html>
