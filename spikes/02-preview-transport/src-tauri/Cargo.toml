[package]
name = "preview-transport-spike"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "M0 spike 2: Tauri v2 preview transport benchmark"

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
libc = "0.2"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSColor", "NSGraphics"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }

[profile.release]
opt-level = 3
