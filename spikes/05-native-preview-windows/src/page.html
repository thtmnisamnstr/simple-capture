<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 13px system-ui, sans-serif; color: #ddd; overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: 220px 1fr; grid-template-rows: 48px 1fr 120px; }
  .panel { background: rgb(40, 40, 48); }
  #top { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
  #side { grid-row: 2 / 4; padding: 12px; }
  #stage { position: relative; overflow: hidden; background: transparent; }
  #hole {
    position: absolute; left: 24px; top: 24px; right: 24px; bottom: 24px;
    background: transparent;
    box-shadow: 0 0 0 100vmax rgb(24, 24, 28);
  }
  #badge { position: absolute; left: 16px; top: 16px; width: 64px; height: 64px; background: rgb(0, 200, 0); }
  #glass { position: absolute; left: 0; right: 0; bottom: 0; height: 25%; background: rgba(0, 0, 255, 0.5); }
  #label { position: absolute; right: 12px; top: 12px; padding: 4px 8px; background: rgba(0, 0, 0, 0.6); border-radius: 6px; }
  #timeline { padding: 12px; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="app">
  <div id="top" class="panel">
    <b>Native preview spike</b>
    <span>mode: __MODE__</span>
    <button id="stress">toggle layout stress</button>
    <span id="stat"></span>
  </div>
  <div id="side" class="panel">sidebar (opaque HTML)</div>
  <div id="stage">
    <div id="hole">
      <div id="badge"></div>
      <div id="glass"></div>
      <div id="label">HTML over the preview</div>
    </div>
  </div>
  <div id="timeline" class="panel">timeline (opaque HTML)</div>
</div>
<script>
  const hole = document.getElementById('hole');
  let last = '';
  let sent = 0;
  function report() {
    const r = hole.getBoundingClientRect();
    const msg = `rect ${r.x} ${r.y} ${r.width} ${r.height} ${window.devicePixelRatio}`;
    if (msg !== last) {
      last = msg;
      sent++;
      window.ipc.postMessage(msg);
    }
  }
  new ResizeObserver(report).observe(hole);
  window.addEventListener('resize', report);
  let stress = __STRESS__;
  document.getElementById('stress').onclick = () => { stress = !stress; if (!stress) { hole.style.inset = ''; } };
  const t0 = performance.now();
  function tick(now) {
    if (stress) {
      const k = Math.sin((now - t0) / 400);
      const m = 24 + Math.round(40 + 40 * k);
      hole.style.inset = `${m}px ${24 + Math.round(30 - 30 * k)}px ${m}px 24px`;
    }
    report();
    document.getElementById('stat').textContent = `rect msgs: ${sent}`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
