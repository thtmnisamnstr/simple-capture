[package]
name = "native-preview-windows-spike"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "M1 spike 5: native wgpu preview under a transparent WebView2 (Windows), tao + wry"

[workspace]

[dependencies]
tao = "=0.37.3"
wry = "=0.57.3"
wgpu = "=30.0.2"
pollster = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
