[package]
name = "sc-spike-macos-pipeline"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "sc-spike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
pollster = "0.4"
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["objc2-io-surface", "objc2-metal"] }
objc2-core-media = { version = "0.3", features = ["objc2-core-video", "objc2-core-audio-types", "block2", "dispatch2"] }
objc2-core-audio-types = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-metal", "objc2-io-surface", "objc2-core-graphics"] }
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface", "objc2-core-foundation", "block2", "dispatch2"] }
objc2-screen-capture-kit = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "block2", "dispatch2", "libc"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer"] }
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-audio-types", "objc2-core-foundation", "objc2-core-graphics", "block2", "dispatch2"] }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std"] }
wgpu-hal = { version = "30", features = ["metal"] }

[profile.release]
debug = 1
