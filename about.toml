# cargo-about 0.9.3: third-party notices for the app binary (docs/LICENSES.md §2.2).
# Generate: scripts/ci/notices.sh [OUT] (template: scripts/ci/about.hbs). Same allow list and
# MPL-2.0 exceptions as deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]
