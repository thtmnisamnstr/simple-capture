[package]
name = "simple-capture-cli"
description = "simple-capture: headless recording, recovery, export, probe and validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "simple-capture"
path = "src/main.rs"

[features]
default = ["export"]
export = ["dep:simple-capture-export", "dep:simple-capture-diagnostics"]
test-hooks = ["simple-capture-record/test-hooks"]

[dependencies]
simple-capture-core.workspace = true
simple-capture-geometry.workspace = true
simple-capture-platform.workspace = true
simple-capture-record.workspace = true
simple-capture-helpers.workspace = true
simple-capture-export = { workspace = true, optional = true }
simple-capture-diagnostics = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
simple-capture-capture-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
simple-capture-capture-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
simple-capture-capture-linux.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
