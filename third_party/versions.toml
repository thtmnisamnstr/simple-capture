# Pinned sources for the bundled export helpers (Simple Capture).
#
# Every artifact here is downloaded at build time only, into third_party/build/downloads,
# and is rejected unless its SHA-256 matches. `third_party/fetch.sh` is the only reader.
#
# Fields
#   version      upstream version (or commit for projects without releases)
#   url          exact download URL
#   file         local filename in third_party/build/downloads
#   sha256       SHA-256 we computed by downloading the file when the pin was set
#   license      SPDX expression of what ends up in the helper binary
#   cross_check  how the sha256 was independently confirmed (see third_party/README.md)
#   lock_file    gifski only: the checked-in Cargo.lock in third_party/gifski/ that replaces the
#                crate's own; lock_sha256 is its SHA-256 and lock_note says what differs
#
# Parsed by a tiny awk reader in third_party/lib.sh: keep one `key = "value"` per line.

[ffmpeg]
version = "9.1"
url = "https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz"
file = "ffmpeg-9.1.tar.xz"
sha256 = "1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433"
license = "GPL-2.0-or-later"
cross_check = "Upstream GPG signature (signature_url, made 2026-11-20, RSA-2048/SHA-512) verified GOOD on 2026-11-24 against the FFmpeg release key FCF986EA15E6E293A5644F10B4322F04D67658D8, fetched with the same fingerprint from ffmpeg.org/ffmpeg-devel.asc, keys.openpgp.org and keyserver.ubuntu.com (checked with a standalone RFC 4880 RSA verifier because gpg is not installed). Homebrew ffmpeg 9.1 formula stable_checksum matches. Tarball contents equal a git clone of tag n9.1 (commit 74e43935) apart from .gitignore/.gitattributes and the generated FF_VERSION file."
signature_url = "https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz.asc"

