[package]
name = "simple-capture-capture-macos"
description = "macOS backend: ScreenCaptureKit, AVFoundation, AppKit glue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sc_capture_macos"

[features]
mas = []

[dependencies]
simple-capture-core.workspace = true
simple-capture-geometry.workspace = true
simple-capture-platform.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2 = { workspace = true, features = ["exception"] }
block2.workspace = true
dispatch2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-core-audio-types.workspace = true
objc2-io-surface.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-av-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true

[[test]]
name = "sck_live"
path = "tests/sck_live/main.rs"
harness = false

[[test]]
name = "av_live"
path = "tests/av_live/main.rs"
harness = false

[lints]
workspace = true
