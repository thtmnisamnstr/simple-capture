[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = [
    { allow = ["WTFPL"], crate = "ffmpeg-next" },
    { allow = ["WTFPL"], crate = "ffmpeg-sys-next" },
    # MPL-2.0, unavoidable with Tauri 2 (ADR-004), used unmodified (file-level copyleft only):
    # tauri-utils -> dom_query -> cssparser, cssparser-macros, selectors, dtoa-short (HTML/CSP
    # processing of the bundled UI), and tauri -> dirs -> dirs-sys -> option-ext.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
deny = [
    { crate = "gifski" },
    { crate = "imagequant" },
    { crate = "x264" },
    { crate = "x264-sys" },
    { crate = "x265" },
    { crate = "x265-sys" },
    { crate = "workspace-hack" },
    { crate = "cap-d3d-adapter" },
    { crate = "cap-mediafoundation-utils" },
    { crate = "cap-cursor-info" },
    { crate = "cap-cpal-ffmpeg" },
    # No HTTP clients or servers in the app (M1 plan, wp-ci). Tauri lists reqwest/hyper only for
    # Android and iOS, which are outside [graph] targets; scripts/ci/deny.sh proves with
    # `cargo tree --target <each desktop target> -i <crate>` that nothing builds them.
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "attohttpc" },
    { crate = "surf" },
]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
