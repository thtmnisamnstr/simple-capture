name: flatpak

# The Flatpak (packaging/flatpak), built offline the way Flathub builds it, for x86_64 and
# aarch64, then checked with Flathub's linter. The bundle is an artifact.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/flatpak/**
      - .github/workflows/flatpak.yml
      - Cargo.lock
      - ui/pnpm-lock.yaml
      - third_party/**
      - app/linux/**
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      ID: io.github.thtmnisamnstr.simple-capture
      MANIFEST: packaging/flatpak/io.github.thtmnisamnstr.simple-capture.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The generated source lists match the lockfiles and pins
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          root = pathlib.Path(".")
          vendored = {s["dest"] for s in json.load(open("packaging/flatpak/cargo-sources.json")) if "dest" in s}
          lock = (root / "Cargo.lock").read_text()
          missing = [f"{n}-{v}" for n, v, src in re.findall(r'name = "([^"]+)"\nversion = "([^"]+)"\nsource = "([^"]+)"', lock)
                     if src.startswith("registry+") and f"cargo/vendor/{n}-{v}" not in vendored]
          pins = {s["dest-filename"]: s["sha256"] for s in json.load(open("packaging/flatpak/helper-sources.json"))}
          toml = (root / "third_party/versions.toml").read_text()
          stale = [f for f, sha in pins.items() if sha not in toml]
          if missing or stale:
              raise SystemExit(f"run packaging/flatpak/generate-sources.py: crates missing {missing[:10]}, stale pins {stale}")
          print(f"{len(vendored)} vendored crates, {len(pins)} helper sources match")
          PY
      # The flathub-infra container cannot update its preinstalled runtimes on the runners'
      # overlayfs (EXDEV, flatpak/flatpak-github-actions#267), so flatpak-builder runs on the host.
      - name: Room for Skia, FFmpeg and the app
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: flatpak and org.flatpak.Builder
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.gnome.Sdk//50 org.gnome.Platform//50 \
            org.freedesktop.Sdk.Extension.node26//25.08 org.freedesktop.Sdk.Extension.llvm21//25.08
      # Saved after failures too, so the next run resumes at the module that failed.
      - name: Restore the builder state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fp-state
          key: flatpak-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: flatpak-${{ matrix.arch }}-
      - name: Build
        run: |
          dbus-run-session flatpak run org.flatpak.Builder --user --disable-rofiles-fuse \
            --force-clean --default-branch=stable --state-dir="$RUNNER_TEMP/fp-state" \
            --repo="$RUNNER_TEMP/fp-repo" "$RUNNER_TEMP/fp-build" "$MANIFEST"
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/fp-repo" "simple-capture-${{ matrix.arch }}.flatpak" "$ID" stable
      - name: Save the builder state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fp-state
          key: flatpak-${{ matrix.arch }}-${{ github.run_id }}
      - name: Flathub linter
        # Reports without failing until the metainfo has its screenshots (packaging/flatpak/README.md).
        continue-on-error: true
        run: |
          dbus-run-session flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest "$MANIFEST" || true
          dbus-run-session flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo "$RUNNER_TEMP/fp-repo"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simple-capture-flatpak-${{ matrix.arch }}
          path: simple-capture-${{ matrix.arch }}.flatpak
          if-no-files-found: error
