name: linux-repos

# Publishes the apt and dnf repositories (https://thtmnisamnstr.github.io/simple-capture) with
# the .deb and .rpm files of a published GitHub Release, signed with the repository key. Setup,
# once: the LINUX_REPO_GPG_KEY secret (scripts/linux-repos/new-key.sh) and Pages with "GitHub
# Actions" as its source (docs/LINUX_DISTRIBUTION.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (v1.2.3)
        required: true

permissions:
  contents: read

concurrency:
  group: linux-repos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "not a version tag: $TAG" >&2; exit 1; }
          gh release download "$TAG" -D dist -p '*.deb' -p '*.rpm'
          ls -l dist
      - name: Repository tools
        run: sudo apt-get install -y --no-install-recommends dpkg-dev createrepo-c rpm
      - name: Build and sign
        env:
          KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the LINUX_REPO_GPG_KEY secret is not set (scripts/linux-repos/new-key.sh)"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --import
          REPO_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          REPO_KEY=$REPO_KEY scripts/linux-repos/build.sh dist site
          rm -rf "$GNUPGHOME"
      - name: Install from them on Ubuntu, Debian and Fedora
        run: scripts/linux-repos/verify.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
