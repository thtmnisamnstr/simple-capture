name: setup
description: >-
  Rust toolchain from rust-toolchain.toml, cargo registry cache, OS packages, CARGO_TARGET_DIR
  and the per-OS test switches (M1 plan §6.4, wp-ci).
inputs:
  full:
    description: "'true' for jobs that link Skia and Tauri (system packages for both)"
    default: "false"
runs:
  using: composite
  steps:
    - name: Toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        rustup toolchain install || rustup show
        rustc --version
        cargo --version

    - name: Cargo registry cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-registry-${{ runner.os }}-

    - name: Target dir
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          # Short path against MAX_PATH in Skia's and Tauri's deep build trees.
          echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
          git config --global core.longpaths true
          # Skia's release build includes headers by ../-relative paths into the cargo registry,
          # which pass MAX_PATH under C:\Users\runneradmin\.cargo; the junction is the same folder.
          [ -e /c/c ] || cmd //c mklink //J 'C:\c' "$USERPROFILE\.cargo"
          echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"
        else
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
        fi

    - name: Ubuntu packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # PipeWire, ALSA and libclang: the Linux backend (cpal's PipeWire host, screen capture);
        # ffmpeg: the helper-track tests fall back to it on PATH; never shipped. GStreamer: the
        # in-process screen track (plugins-ugly gives its test x264enc, which the app never uses).
        # GTK: the backend's clipboard and portal-dialog parents.
        pkgs=(mesa-vulkan-drivers libvulkan1 pkg-config clang libclang-dev libasound2-dev
              libpipewire-0.3-dev libspa-0.2-dev ffmpeg libgtk-3-dev
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
              gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly)
        if [ "${{ inputs.full }}" = true ]; then
          pkgs+=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
                 libxdo-dev ninja-build python3 libfontconfig1-dev)
        fi
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
        # lavapipe gives wgpu a software Vulkan adapter, so GPU tests must run here.
        echo "SC_REQUIRE_GPU=1" >> "$GITHUB_ENV"

    - name: Windows tools (LLVM, ninja, python)
      if: runner.os == 'Windows' && inputs.full == 'true'
      shell: bash
      run: |
        choco install ninja --no-progress -y
        if [ -d "/c/Program Files/LLVM" ]; then
          echo 'LLVM_HOME=C:\Program Files\LLVM' >> "$GITHUB_ENV"
        else
          choco install llvm --no-progress -y
          echo 'LLVM_HOME=C:\Program Files\LLVM' >> "$GITHUB_ENV"
        fi
        python --version
        "/c/Program Files/LLVM/bin/clang" --version

    - name: macOS tools
      if: runner.os == 'macOS' && inputs.full == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: brew install ninja

    - name: macOS runner switches
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "SC_ALLOW_NO_HW_ENCODER=1" >> "$GITHUB_ENV"
        echo "::warning title=VideoToolbox::SC_ALLOW_NO_HW_ENCODER=1 on this runner: tests that need a hardware HEVC encoder print SKIPPED: when the VM has none. Full coverage runs locally (just test)."
