name: skia-cache
description: >-
  Cache the Skia FreeType source build (ADR-018) separately from target/: the skia-bindings crate
  source (Skia plus the third-party sources its build syncs) and its build-script output for one
  Cargo profile, keyed by scripts/ci/skia-cache-key.sh (runner image, profile, toolchain,
  skia-safe features, Cargo profiles, .cargo/config.toml and the Cargo.lock entries of
  skia-bindings and its build dependencies). Both halves are restored together so ninja's
  timestamps stay consistent and the rebuild is a no-op.
  mode=restore before the first cargo build; mode=save right after it (runs even if later steps
  fail, so a red test run still keeps the 20-40 min Skia build).
inputs:
  mode:
    description: restore | save
    required: true
  profile:
    description: "Cargo profile directory that builds Skia: 'debug' (cargo build/test) or 'release' (tauri build)"
    default: debug
outputs:
  cache-hit:
    description: "'true' when restore found an exact match"
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Cache key
      id: key
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: bash scripts/ci/skia-cache-key.sh "$PROFILE" >> "$GITHUB_OUTPUT"

    - name: Restore Skia build
      id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/src/*/skia-bindings-${{ steps.key.outputs.version }}
          ${{ env.CARGO_TARGET_DIR }}/${{ inputs.profile }}/build/skia-bindings-*/out
        key: ${{ steps.key.outputs.key }}

    - name: Save Skia build
      if: inputs.mode == 'save'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/src/*/skia-bindings-${{ steps.key.outputs.version }}
          ${{ env.CARGO_TARGET_DIR }}/${{ inputs.profile }}/build/skia-bindings-*/out
        key: ${{ steps.key.outputs.key }}
