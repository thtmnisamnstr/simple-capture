# The Snap is the .deb that package.yml builds (same binary, helpers, fonts and licenses), on the
# GNOME 46 content snap for WebKitGTK, GTK and GStreamer. package.yml copies the .deb here as
# simple-capture.deb and builds with snapcore/action-build; the version comes from the metainfo's
# newest release.
name: simple-capture
base: core24
adopt-info: simple-capture
summary: Record your screen, camera and voice, edit, and export
license: MIT AND GPL-2.0-or-later
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
  arm64:

apps:
  simple-capture:
    command: usr/bin/simple-capture-app
    command-chain: [local/launch]
    desktop: usr/share/applications/io.github.thtmnisamnstr.SimpleCapture.desktop
    common-id: io.github.thtmnisamnstr.SimpleCapture
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - camera
      - audio-record
      - audio-playback
      # Microphones and the system-audio monitor go through PipeWire directly (cpal's PipeWire
      # host). The interface doesn't auto-connect: snap connect simple-capture:pipewire.
      - pipewire
      - opengl
      - unity7

parts:
  simple-capture:
    plugin: dump
    source: simple-capture.deb
    source-type: deb
    parse-info: [usr/share/metainfo/io.github.thtmnisamnstr.SimpleCapture.metainfo.xml]
    stage-packages:
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - libopenh264-7
    prime:
      - -usr/share/applications/simple-capture.desktop
    override-prime: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/simple-capture-app.png|' \
        usr/share/applications/io.github.thtmnisamnstr.SimpleCapture.desktop

  launcher:
    plugin: dump
    source: local
    organize:
      launch: local/launch
