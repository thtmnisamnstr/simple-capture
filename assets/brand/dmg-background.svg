<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33906a"/>
      <stop offset="1" stop-color="#2a7f5b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#dots)"/>
  <rect width="660" height="400" fill="url(#glow)"/>

  <text x="330" y="62" text-anchor="middle" fill="#ffffff"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.2">Install Simple Capture</text>
  <text x="330" y="88" text-anchor="middle" fill="#ffffff" fill-opacity="0.82"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="13.5">Drag the app onto the Applications folder.</text>

  <rect x="96" y="126" width="148" height="164" rx="22" fill="#ffffff" fill-opacity="0.07"
        stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="416" y="126" width="148" height="164" rx="22" fill="#ffffff" fill-opacity="0.07"
        stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="5 5"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 200 C 305 172, 355 172, 390 200"/>
    <path d="M376 202 L391 201 L389 186"/>
  </g>

  <text x="330" y="364" text-anchor="middle" fill="#ffffff" fill-opacity="0.6"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="11.5">Then open it from Applications or Spotlight.</text>
</svg>
